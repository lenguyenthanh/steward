name: Steward

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  steward:
    runs-on: ubuntu-latest
    name: Steward
    steps:
      - uses: actions/checkout@v7
      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: 207632
          private_key: ${{ secrets.STEWARD_SECRET }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@v2.96.0
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          author-email: 106868453+nt9-steward[bot]@users.noreply.github.com
          author-name: nt9-steward[bot]
          github-app-id: 207632
          github-app-key: ${{ secrets.STEWARD_SECRET }}
